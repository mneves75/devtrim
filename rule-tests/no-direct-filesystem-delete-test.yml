id: no-direct-filesystem-delete
valid:
  - apply_filesystem_finding(finding, ctx)?;
  - crate::ops::remove_test_path(path);
  - std::fs::read_dir(path)?;
  - |
      #[cfg(test)]
      mod tests {
          fn cleanup() {
              std::fs::remove_dir_all(path).ok();
          }
      }
invalid:
  - std::fs::remove_file(path)?;
  - fs::remove_file(path)?;
  - remove_file(path)?;
  - std::fs::remove_dir(path)?;
  - fs::remove_dir(path)?;
  - remove_dir(path)?;
  - std::fs::remove_dir_all(path)?;
  - fs::remove_dir_all(path)?;
  - remove_dir_all(path)?;
  - trash::delete(path)?;
  - delete(path)?;
  - dir.remove_file(path)?;
  - dir.remove_open_dir()?;
  - rustix::fs::unlinkat(dirfd, path, flags)?;
  - |
      fn accidental_second_sink(path: &Path) -> Result<()> {
          std::fs::remove_file(path)?;
          Ok(())
      }
  - |
      fn remove_path(target: VerifiedTarget, permanent: bool, expected: FileIdentity) -> Result<()> {
          let path = target.path;
          std::fs::remove_file(path)?;
          Ok(())
      }
