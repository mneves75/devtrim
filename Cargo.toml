[package]
name = "devtrim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Marcus Neves"]
description = "Developer-machine disk hygiene: measure, classify, trim — safely."
license = "Apache-2.0"
repository = "https://github.com/mneves75/devtrim"
keywords = ["cli", "macos", "disk", "cleanup", "developer"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
walkdir = "2.5"
trash = "5"
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1"

[profile.release]
lto = true
strip = true
