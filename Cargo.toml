[package]
name = "devtrim"
version = "0.6.1"
edition = "2024"
rust-version = "1.88"
authors = ["Marcus Neves"]
description = "Developer-machine disk hygiene: measure, classify, trim — safely."
license = "Apache-2.0"
repository = "https://github.com/mneves75/devtrim"
keywords = ["cli", "macos", "disk", "cleanup", "developer"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
cap-std = "4.0.3"
rustix = { version = "1.1.4", features = ["fs"] }
walkdir = "2.5"
trash = "5"
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29.0"
clap_complete = "4.5.55"
clap_mangen = "0.2.31"
unicode-normalization = "0.1.25"

[profile.release]
lto = true
strip = true

[workspace]
exclude = ["fuzz"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dev-dependencies]
proptest = "1.11"
tempfile = "3.27"
