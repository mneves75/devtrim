[package]
name = "apfs-size"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "What deleting a file frees on APFS: its private size and clone family, read with getattrlist(2)."
license = "Apache-2.0"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
