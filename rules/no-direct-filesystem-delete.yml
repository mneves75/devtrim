id: no-direct-filesystem-delete
language: Rust
severity: error
message: Filesystem deletion must go through src/ops/mod.rs's verified-target sink.
note: Keep validation and physical removal coupled at the single shared boundary.
files:
  - src/**/*.rs
ignores:
  - src/ops/mod.rs
rule:
  all:
    - any:
        - pattern: $MODULE::remove_file($TARGET)
        - pattern: remove_file($TARGET)
        - pattern: $MODULE::remove_dir($TARGET)
        - pattern: remove_dir($TARGET)
        - pattern: $MODULE::remove_dir_all($TARGET)
        - pattern: remove_dir_all($TARGET)
        - pattern: $MODULE::delete($TARGET)
        - pattern: delete($TARGET)
        - pattern: $RECV.remove_file($$$ARGS)
        - pattern: $RECV.remove_dir($$$ARGS)
        - pattern: $RECV.remove_dir_all($$$ARGS)
        - pattern: $RECV.remove_open_dir_all($$$ARGS)
        - pattern: $RECV.remove_open_dir($$$ARGS)
        - pattern: $MODULE::unlinkat($$$ARGS)
        - pattern: unlinkat($$$ARGS)
    - not:
        inside:
          pattern:
            context: |
              #[cfg(test)]
              mod tests {
                $$$BODY
              }
            selector: mod_item
          stopBy: end
