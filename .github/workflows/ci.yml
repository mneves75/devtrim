name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustup target add aarch64-apple-darwin

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install pinned npm
        run: |
          npm install --global npm@11.17.0 --ignore-scripts
          npm --version | grep -Fqx '11.17.0'

      - name: Release policy tests
        run: |
          bash scripts/tests/release-policy.sh
          bash -n scripts/release.sh scripts/update-homebrew.sh scripts/tests/release-policy.sh scripts/tests/update-homebrew-formula.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Structural lint
        run: |
          cargo install ast-grep --locked --version 0.45.0
          ast-grep test --skip-snapshot-tests
          ast-grep scan --config sgconfig.yml

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets --all-features

      - name: MSRV tests
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup run 1.88.0 cargo test --locked --all-targets --all-features

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
          cargo audit --file fuzz/Cargo.lock

      - name: Video lint and dependency audit
        working-directory: video
        run: |
          npm config get strict-allow-scripts | grep -Fqx 'true'
          npm ci --strict-allow-scripts
          npm audit --package-lock-only --audit-level=low
          npm run lint
          npm run format:check
          npm run build

      - name: Locked arm64 release build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          file target/aarch64-apple-darwin/release/devtrim | grep -q 'arm64'
          target/aarch64-apple-darwin/release/devtrim --version
