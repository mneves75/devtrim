name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      release: ${{ steps.meta.outputs.release }}
      base: ${{ steps.meta.outputs.base }}
      is_beta: ${{ steps.meta.outputs.is_beta }}
      release_exists: ${{ steps.meta.outputs.release_exists }}
      out: ${{ steps.meta.outputs.out }}
    steps:
      - name: Checkout tagged source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] || { echo "ERROR: release requires a tag"; exit 1; }
          release="${GITHUB_REF_NAME#v}"
          [[ "$release" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-beta[1-9][0-9]*)?$ ]] || {
            echo "ERROR: release tag must be vX.Y.Z or vX.Y.Z-betaN"
            exit 1
          }
          base="${BASH_REMATCH[1]}"
          suffix="${BASH_REMATCH[2]:-}"
          [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" == "tag" ]] || {
            echo "ERROR: release tag must be annotated"
            exit 1
          }
          [[ "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" == "${GITHUB_SHA}" ]] || {
            echo "ERROR: release tag does not dereference to workflow commit"
            exit 1
          }
          grep -Fqx "version = \"$base\"" Cargo.toml
          grep -Fq "## [$base]" CHANGELOG.md
          grep -Fq "v$base" README.md
          grep -Fq "v$base" MANUAL.html

          ci_conclusion=$(gh run list --workflow ci.yml --event push --commit "${GITHUB_SHA}" --limit 1 --json conclusion,status --jq '.[0] | select(.status == "completed") | .conclusion')
          [[ "$ci_conclusion" == "success" ]] || {
            echo "ERROR: release commit has no successful completed CI run"
            exit 1
          }

          mkdir -p handoff
          notes="handoff/release-notes.md"
          awk -v hdr="## [$base]" 'index($0,hdr)==1{found=1;next} /^## /{if(found)exit} found' CHANGELOG.md > "$notes"
          [[ -s "$notes" ]] || { echo "ERROR: release notes are empty"; exit 1; }

          is_beta=false
          [[ -z "$suffix" ]] || is_beta=true
          release_exists=false
          if existing=$(gh release view "${GITHUB_REF_NAME}" --json isDraft,isImmutable,isPrerelease,tagName); then
            [[ "$(jq -r .isDraft <<<"$existing")" == "false" ]] || {
              echo "ERROR: a draft release already exists; inspect it before retrying"
              exit 1
            }
            [[ "$(jq -r .isImmutable <<<"$existing")" == "true" ]] || {
              echo "ERROR: an existing release is mutable"
              exit 1
            }
            [[ "$(jq -r .isPrerelease <<<"$existing")" == "$is_beta" ]] || {
              echo "ERROR: existing release type does not match tag"
              exit 1
            }
            release_exists=true
          fi

          {
            echo "release=$release"
            echo "base=$base"
            echo "is_beta=$is_beta"
            echo "release_exists=$release_exists"
            echo "out=devtrim-$base-macos-arm64"
          } >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust
        if: steps.meta.outputs.is_beta == 'true' && steps.meta.outputs.release_exists == 'false'
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add aarch64-apple-darwin

      - name: Build beta artifact
        if: steps.meta.outputs.is_beta == 'true' && steps.meta.outputs.release_exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          binary="target/aarch64-apple-darwin/release/devtrim"
          file "$binary" | grep -q 'arm64'
          "$binary" --version | grep -Fqx "devtrim ${{ steps.meta.outputs.base }}"

      - name: Package beta artifact
        if: steps.meta.outputs.is_beta == 'true' && steps.meta.outputs.release_exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          out="${{ steps.meta.outputs.out }}"
          mkdir -p "dist/$out"
          cp target/aarch64-apple-darwin/release/devtrim "dist/$out/devtrim"
          cp MANUAL.html README.md LICENSE "dist/$out/"
          ( cd dist && zip -qr "$out.zip" "$out" )
          ( cd dist && shasum -a 256 "$out.zip" > SHA256SUMS.txt )
          unzip -l "dist/$out.zip"
          ( cd dist && shasum -a 256 -c SHA256SUMS.txt )
          cp "dist/$out.zip" dist/SHA256SUMS.txt handoff/

      - name: Transfer reviewed release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-input-${{ github.run_id }}
          path: handoff/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download reviewed release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ github.run_id }}
          path: handoff

      - name: Refresh publication state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_exists=false
          if existing=$(gh release view "${GITHUB_REF_NAME}" --json isDraft,isImmutable,isPrerelease,tagName); then
            [[ "$(jq -r .isDraft <<<"$existing")" == "false" ]] || {
              echo "ERROR: a draft release already exists; inspect it before retrying"
              exit 1
            }
            [[ "$(jq -r .isImmutable <<<"$existing")" == "true" ]] || {
              echo "ERROR: an existing release is mutable"
              exit 1
            }
            [[ "$(jq -r .isPrerelease <<<"$existing")" == "${{ needs.prepare.outputs.is_beta }}" ]] || {
              echo "ERROR: existing release type does not match tag"
              exit 1
            }
            release_exists=true
          fi
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"

      - name: Attest beta artifact
        if: needs.prepare.outputs.is_beta == 'true' && steps.state.outputs.release_exists == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: handoff/${{ needs.prepare.outputs.out }}.zip

      - name: Publish beta prerelease
        if: needs.prepare.outputs.is_beta == 'true' && steps.state.outputs.release_exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="${{ needs.prepare.outputs.out }}"
          release_args=(
            "${GITHUB_REF_NAME}"
            "handoff/$out.zip"
            handoff/SHA256SUMS.txt
            --verify-tag
            --prerelease
            --latest=false
            --title "devtrim ${{ needs.prepare.outputs.release }}"
            --notes-file handoff/release-notes.md
          )
          gh release create "${release_args[@]}"

      - name: Select verified beta artifact
        if: needs.prepare.outputs.is_beta == 'false' && steps.state.outputs.release_exists == 'false'
        id: promote
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${{ needs.prepare.outputs.base }}"
          out="${{ needs.prepare.outputs.out }}"
          beta_tag=""
          promotion_dir=""

          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            ref_state=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$candidate") || continue
            [[ "$(jq -r .object.type <<<"$ref_state")" == "tag" ]] || continue
            tag_state=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<<"$ref_state")") || continue
            [[ "$(jq -r .object.type <<<"$tag_state")" == "commit" ]] || continue
            [[ "$(jq -r .object.sha <<<"$tag_state")" == "${GITHUB_SHA}" ]] || continue

            candidate_state=$(gh release view "$candidate" --json isDraft,isImmutable,isPrerelease,assets)
            [[ "$(jq -r .isDraft <<<"$candidate_state")" == "false" ]] || continue
            [[ "$(jq -r .isImmutable <<<"$candidate_state")" == "true" ]] || continue
            [[ "$(jq -r .isPrerelease <<<"$candidate_state")" == "true" ]] || continue
            asset_names=$(jq -r '.assets[].name' <<<"$candidate_state" | sort)
            expected_names=$(printf '%s\n%s\n' SHA256SUMS.txt "$out.zip" | sort)
            [[ "$asset_names" == "$expected_names" ]] || continue
            gh release verify "$candidate" --format json >/dev/null || continue

            candidate_dir="${RUNNER_TEMP}/candidate-${candidate##*-beta}"
            mkdir -p "$candidate_dir"
            gh release download "$candidate" --dir "$candidate_dir" --pattern "$out.zip" --pattern SHA256SUMS.txt || continue
            ( cd "$candidate_dir" && shasum -a 256 -c SHA256SUMS.txt ) || continue
            attestation_args=(
              --repo "${GITHUB_REPOSITORY}"
              --source-digest "${GITHUB_SHA}"
              --source-ref "refs/tags/$candidate"
            )
            gh attestation verify "$candidate_dir/$out.zip" "${attestation_args[@]}" >/dev/null || continue

            beta_tag="$candidate"
            promotion_dir="$candidate_dir"
            break
          done < <(
            gh release list --limit 1000 --json tagName,isDraft,isImmutable,isPrerelease --jq '
                [.[] |
                  select(.isDraft == false and .isImmutable == true and .isPrerelease == true) |
                  select(.tagName | startswith("v'"${base}"'-beta")) |
                  select(.tagName | test("-beta[1-9][0-9]*$")) |
                  . + {beta_number: (.tagName | capture("beta(?<n>[0-9]+)$").n | tonumber)}
                ] |
                sort_by(.beta_number) |
                reverse |
                .[].tagName
              '
          )

          [[ -n "$beta_tag" ]] || {
            echo "ERROR: no immutable attested beta from this commit is promotable"
            exit 1
          }
          {
            echo "beta_tag=$beta_tag"
            echo "promotion_dir=$promotion_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Publish production release
        if: needs.prepare.outputs.is_beta == 'false' && steps.state.outputs.release_exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="${{ needs.prepare.outputs.out }}"
          promotion_dir="${{ steps.promote.outputs.promotion_dir }}"
          release_args=(
            "${GITHUB_REF_NAME}"
            "$promotion_dir/$out.zip"
            "$promotion_dir/SHA256SUMS.txt"
            --verify-tag
            --latest
            --title "devtrim ${{ needs.prepare.outputs.release }}"
            --notes-file handoff/release-notes.md
          )
          gh release create "${release_args[@]}"

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="${{ needs.prepare.outputs.out }}"
          published="${RUNNER_TEMP}/published"
          mkdir -p "$published"
          gh release download "${GITHUB_REF_NAME}" --dir "$published" --pattern "$out.zip" --pattern SHA256SUMS.txt
          asset_names=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)
          expected_names=$(printf '%s\n%s\n' SHA256SUMS.txt "$out.zip" | sort)
          [[ "$asset_names" == "$expected_names" ]] || {
            echo "ERROR: published release asset set is not exact"
            exit 1
          }
          ( cd "$published" && shasum -a 256 -c SHA256SUMS.txt )

          release_state=$(gh release view "${GITHUB_REF_NAME}" --json isDraft,isImmutable,isPrerelease,tagName)
          [[ "$(jq -r .isDraft <<<"$release_state")" == "false" ]]
          [[ "$(jq -r .isImmutable <<<"$release_state")" == "true" ]]
          [[ "$(jq -r .isPrerelease <<<"$release_state")" == "${{ needs.prepare.outputs.is_beta }}" ]]

          release_verified=false
          for _ in {1..10}; do
            if gh release verify "${GITHUB_REF_NAME}" --format json >/dev/null; then
              release_verified=true
              break
            fi
            sleep 3
          done
          [[ "$release_verified" == "true" ]] || {
            echo "ERROR: immutable release attestation did not verify"
            exit 1
          }

          attestation_args=(
            --repo "${GITHUB_REPOSITORY}"
            --source-digest "${GITHUB_SHA}"
          )
          if [[ "${{ needs.prepare.outputs.is_beta }}" == "true" ]]; then
            attestation_args+=(--source-ref "${GITHUB_REF}")
          fi
          gh attestation verify "$published/$out.zip" "${attestation_args[@]}" >/dev/null
