name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag provenance
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release: ${{ steps.meta.outputs.release }}
      base: ${{ steps.meta.outputs.base }}
      is_beta: ${{ steps.meta.outputs.is_beta }}
      release_exists: ${{ steps.meta.outputs.release_exists }}
      out: ${{ steps.meta.outputs.out }}
    steps:
      - name: Checkout tagged source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, default-branch head, and release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] || { echo "ERROR: release requires a tag"; exit 1; }
          release="${GITHUB_REF_NAME#v}"
          [[ "$release" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-beta[1-9][0-9]*)?$ ]] || {
            echo "ERROR: release tag must be vX.Y.Z or vX.Y.Z-betaN"
            exit 1
          }
          base="${BASH_REMATCH[1]}"
          suffix="${BASH_REMATCH[2]:-}"
          [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" == "tag" ]] || {
            echo "ERROR: release tag must be annotated"
            exit 1
          }
          [[ "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" == "${GITHUB_SHA}" ]] || {
            echo "ERROR: release tag does not dereference to workflow commit"
            exit 1
          }

          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          [[ -n "$default_branch" ]] || {
            echo "ERROR: repository default branch is unavailable"
            exit 1
          }
          git -c submodule.recurse=false fetch --quiet --no-tags origin \
            "refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
          origin_head=$(git rev-parse "refs/remotes/origin/${default_branch}^{commit}")
          github_head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq .sha)
          [[ "$origin_head" == "$github_head" ]] || {
            echo "ERROR: fetched origin/$default_branch does not match GitHub's current head"
            exit 1
          }
          [[ "${GITHUB_SHA}" == "$origin_head" ]] || {
            echo "ERROR: release tags must point at the current origin/$default_branch head"
            exit 1
          }

          grep -Fqx "version = \"$base\"" Cargo.toml
          grep -Fq "## [$base]" CHANGELOG.md
          grep -Fq "v$base" README.md
          grep -Fq "v$base" MANUAL.html

          ci_conclusion=$(gh run list --workflow ci.yml --event push --commit "${GITHUB_SHA}" --limit 1 \
            --json conclusion,status --jq '.[0] | select(.status == "completed") | .conclusion')
          [[ "$ci_conclusion" == "success" ]] || {
            echo "ERROR: release commit has no successful completed CI run"
            exit 1
          }

          is_beta=false
          [[ -z "$suffix" ]] || is_beta=true
          release_exists=false
          if existing=$(gh release view "${GITHUB_REF_NAME}" --json isDraft,isImmutable,isPrerelease,tagName); then
            [[ "$(jq -r .isDraft <<<"$existing")" == "false" ]] || {
              echo "ERROR: a draft release already exists; inspect it before retrying"
              exit 1
            }
            [[ "$(jq -r .isImmutable <<<"$existing")" == "true" ]] || {
              echo "ERROR: an existing release is mutable"
              exit 1
            }
            [[ "$(jq -r .isPrerelease <<<"$existing")" == "$is_beta" ]] || {
              echo "ERROR: existing release type does not match tag"
              exit 1
            }
            release_exists=true
          fi

          {
            echo "release=$release"
            echo "base=$base"
            echo "is_beta=$is_beta"
            echo "release_exists=$release_exists"
            echo "out=devtrim-$base-macos-arm64"
          } >> "$GITHUB_OUTPUT"

  gate:
    name: Read-only deterministic release gates
    needs: validate
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustup toolchain install 1.88.0 --profile minimal

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install pinned npm
        run: |
          npm install --global npm@11.17.0 --ignore-scripts
          npm --version | grep -Fqx '11.17.0'

      - name: Install pinned Rust release tools
        run: |
          cargo install ast-grep --locked --version 0.45.0
          cargo install cargo-audit --locked --version 0.22.2

      - name: Install checksum-verified release tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || {
            echo "ERROR: pinned release-tool assets require the macos-15-intel x86_64 runner"
            exit 1
          }
          tool_root="${RUNNER_TEMP}/release-tools"
          tool_bin="$tool_root/bin"
          mkdir -p "$tool_bin"

          gh release download v1.7.12 -R rhysd/actionlint \
            --pattern actionlint_1.7.12_darwin_amd64.tar.gz --dir "$tool_root"
          gh release download v8.30.1 -R gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_darwin_x64.tar.gz --dir "$tool_root"
          gh release download v3.97.1 -R trufflesecurity/trufflehog \
            --pattern trufflehog_3.97.1_darwin_amd64.tar.gz --dir "$tool_root"
          gh release download v0.11.0 -R koalaman/shellcheck \
            --pattern shellcheck-v0.11.0.darwin.x86_64.tar.gz --dir "$tool_root"

          (
            cd "$tool_root"
            printf '%s  %s\n' 5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644 \
              actionlint_1.7.12_darwin_amd64.tar.gz | shasum -a 256 -c -
            printf '%s  %s\n' dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709 \
              gitleaks_8.30.1_darwin_x64.tar.gz | shasum -a 256 -c -
            printf '%s  %s\n' 1515710bb16be5653ca9986c27ecd1a0e7536fc6e53ad46f7100992692f6a05f \
              trufflehog_3.97.1_darwin_amd64.tar.gz | shasum -a 256 -c -
            printf '%s  %s\n' c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51 \
              shellcheck-v0.11.0.darwin.x86_64.tar.gz | shasum -a 256 -c -
          )

          tar -xzf "$tool_root/actionlint_1.7.12_darwin_amd64.tar.gz" -C "$tool_bin" actionlint
          tar -xzf "$tool_root/gitleaks_8.30.1_darwin_x64.tar.gz" -C "$tool_bin" gitleaks
          tar -xzf "$tool_root/trufflehog_3.97.1_darwin_amd64.tar.gz" -C "$tool_bin" trufflehog
          tar -xzf "$tool_root/shellcheck-v0.11.0.darwin.x86_64.tar.gz" -C "$tool_root"
          cp "$tool_root/shellcheck-v0.11.0/shellcheck" "$tool_bin/shellcheck"
          chmod +x "$tool_bin/actionlint" "$tool_bin/gitleaks" "$tool_bin/trufflehog" "$tool_bin/shellcheck"
          "$tool_bin/actionlint" -version
          "$tool_bin/gitleaks" version
          "$tool_bin/trufflehog" --version
          "$tool_bin/shellcheck" --version
          scripts/tests/gitleaks-positive-control.sh "$tool_bin/gitleaks"
          echo "$tool_bin" >> "$GITHUB_PATH"

      - name: Release policy, shell, and workflow gates
        run: |
          bash scripts/tests/release-policy.sh
          bash -n scripts/release.sh scripts/update-homebrew.sh scripts/tests/release-policy.sh scripts/tests/update-homebrew-formula.sh
          sh -n .githooks/pre-commit scripts/tests/shellcheck-tracked.sh scripts/tests/gitleaks-positive-control.sh
          scripts/tests/shellcheck-tracked.sh
          actionlint
          cmp -s AGENTS.md CLAUDE.md || {
            echo "ERROR: AGENTS.md and CLAUDE.md differ"
            exit 1
          }

      - name: Rust format and deletion-boundary gates
        run: |
          cargo fmt --all -- --check
          ast-grep test --skip-snapshot-tests
          ast-grep scan --config sgconfig.yml

      - name: Rust Clippy and tests
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

      - name: MSRV tests
        run: rustup run 1.88.0 cargo test --locked --all-targets --all-features

      - name: Root and fuzz dependency audits
        run: |
          cargo audit
          cargo audit --file fuzz/Cargo.lock

      - name: Real PTY TUI cancel flow
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked
          tui_home="${RUNNER_TEMP}/devtrim-tui-home"
          mkdir -p "$tui_home"
          TUI_TEST_HOME="$tui_home" expect <<'EXPECT'
          set timeout 15
          log_user 0
          spawn env HOME=$env(TUI_TEST_HOME) TERM=xterm-256color target/debug/devtrim
          after 500
          send "\033"
          expect eof
          set result [wait]
          exit [lindex $result 3]
          EXPECT

      - name: Video install, audit, lint, format, and build
        working-directory: video
        run: |
          npm config get strict-allow-scripts | grep -Fqx 'true'
          npm ci --strict-allow-scripts
          npm audit --package-lock-only --audit-level=low
          npm run lint
          npm run format:check
          npm run build

      - name: Full-history secret scans
        run: |
          gitleaks git --redact --no-banner .
          trufflehog git "file://$(pwd)" --results=verified,unknown --fail \
            --fail-on-scan-errors --no-update --no-color

      - name: Release gates leave the checkout clean
        run: |
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all --ignore-submodules=all)" ]] || {
            echo "ERROR: release gates changed the checkout"
            git status --short
            exit 1
          }

  fuzz:
    name: Read-only bounded fuzz gates
    needs: validate
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned fuzz toolchains
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup toolchain install nightly-2026-08-25 --profile minimal --component rust-src
          cargo install cargo-fuzz --locked --version 0.13.2

      - name: Fuzz all five release targets for 60 seconds each
        shell: bash
        run: |
          set -euo pipefail
          nightly_bin=$(dirname "$(rustup which cargo --toolchain nightly-2026-08-25)")
          fuzz_path="${nightly_bin}:${HOME}/.cargo/bin:${PATH}"
          for target in validate_path clean_path docker_size probe_parsers config_parse; do
            echo "==> fuzzing $target for 60 seconds"
            PATH="$fuzz_path" cargo fuzz run "$target" -- -max_total_time=60
          done

      - name: Fuzz gates leave the checkout clean
        run: |
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all --ignore-submodules=all)" ]] || {
            echo "ERROR: fuzz gates changed the checkout"
            git status --short
            exit 1
          }

  prepare:
    name: Prepare reviewed release inputs
    needs: [validate, gate, fuzz]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate default-branch head and create release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          git -c submodule.recurse=false fetch --quiet --no-tags origin \
            "refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
          origin_head=$(git rev-parse "refs/remotes/origin/${default_branch}^{commit}")
          github_head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq .sha)
          [[ "${GITHUB_SHA}" == "$origin_head" && "$origin_head" == "$github_head" ]] || {
            echo "ERROR: release commit is no longer the current origin/$default_branch head"
            exit 1
          }

          mkdir -p handoff
          notes="handoff/release-notes.md"
          awk -v hdr="## [${{ needs.validate.outputs.base }}]" \
            'index($0,hdr)==1{found=1;next} /^## /{if(found)exit} found' CHANGELOG.md > "$notes"
          [[ -s "$notes" ]] || { echo "ERROR: release notes are empty"; exit 1; }

      - name: Install pinned Rust
        if: needs.validate.outputs.is_beta == 'true' && needs.validate.outputs.release_exists == 'false'
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add aarch64-apple-darwin

      - name: Build beta artifact
        if: needs.validate.outputs.is_beta == 'true' && needs.validate.outputs.release_exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          binary="target/aarch64-apple-darwin/release/devtrim"
          file "$binary" | grep -q 'arm64'
          "$binary" --version | grep -Fqx "devtrim ${{ needs.validate.outputs.base }}"
          codesign --force --sign - "$binary"
          codesign --verify --strict "$binary"
          codesign --display --verbose=2 "$binary" 2>&1 | grep -E 'Signature|Identifier'

      - name: Package beta artifact
        if: needs.validate.outputs.is_beta == 'true' && needs.validate.outputs.release_exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          out="${{ needs.validate.outputs.out }}"
          mkdir -p "dist/$out"
          cp target/aarch64-apple-darwin/release/devtrim "dist/$out/devtrim"
          cp MANUAL.html README.md LICENSE favicon.svg "dist/$out/"
          ( cd dist && zip -qr "$out.zip" "$out" )
          ( cd dist && shasum -a 256 "$out.zip" > SHA256SUMS.txt )
          unzip -l "dist/$out.zip"
          ( cd dist && shasum -a 256 -c SHA256SUMS.txt )
          cp "dist/$out.zip" dist/SHA256SUMS.txt handoff/

      - name: Transfer reviewed release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-input-${{ github.run_id }}
          path: handoff/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Publish without source checkout
    needs: [validate, prepare]
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Revalidate publication state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          default_head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq .sha)
          [[ "${GITHUB_SHA}" == "$default_head" ]] || {
            echo "ERROR: release commit is no longer the current default-branch head"
            exit 1
          }
          release_exists=false
          if existing=$(gh release view "${GITHUB_REF_NAME}" --json isDraft,isImmutable,isPrerelease,tagName); then
            [[ "$(jq -r .isDraft <<<"$existing")" == "false" ]] || {
              echo "ERROR: a draft release already exists; inspect it before retrying"
              exit 1
            }
            [[ "$(jq -r .isImmutable <<<"$existing")" == "true" ]] || {
              echo "ERROR: an existing release is mutable"
              exit 1
            }
            [[ "$(jq -r .isPrerelease <<<"$existing")" == "${{ needs.validate.outputs.is_beta }}" ]] || {
              echo "ERROR: existing release type does not match tag"
              exit 1
            }
            release_exists=true
          fi
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"

      - name: Download reviewed release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ github.run_id }}
          path: handoff

      - name: Attest beta artifact
        if: needs.validate.outputs.is_beta == 'true' && steps.state.outputs.release_exists == 'false'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: handoff/${{ needs.validate.outputs.out }}.zip

      - name: Publish beta prerelease
        if: needs.validate.outputs.is_beta == 'true' && steps.state.outputs.release_exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="${{ needs.validate.outputs.out }}"
          release_args=(
            "${GITHUB_REF_NAME}"
            "handoff/$out.zip"
            handoff/SHA256SUMS.txt
            --verify-tag
            --prerelease
            --latest=false
            --title "devtrim ${{ needs.validate.outputs.release }}"
            --notes-file handoff/release-notes.md
          )
          gh release create "${release_args[@]}"

      - name: Select verified beta artifact
        if: needs.validate.outputs.is_beta == 'false' && steps.state.outputs.release_exists == 'false'
        id: promote
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${{ needs.validate.outputs.base }}"
          out="${{ needs.validate.outputs.out }}"
          beta_tag=""
          promotion_dir=""

          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            ref_state=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$candidate") || continue
            [[ "$(jq -r .object.type <<<"$ref_state")" == "tag" ]] || continue
            tag_state=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<<"$ref_state")") || continue
            [[ "$(jq -r .object.type <<<"$tag_state")" == "commit" ]] || continue
            [[ "$(jq -r .object.sha <<<"$tag_state")" == "${GITHUB_SHA}" ]] || continue

            candidate_state=$(gh release view "$candidate" --json isDraft,isImmutable,isPrerelease,assets)
            [[ "$(jq -r .isDraft <<<"$candidate_state")" == "false" ]] || continue
            [[ "$(jq -r .isImmutable <<<"$candidate_state")" == "true" ]] || continue
            [[ "$(jq -r .isPrerelease <<<"$candidate_state")" == "true" ]] || continue
            asset_names=$(jq -r '.assets[].name' <<<"$candidate_state" | sort)
            expected_names=$(printf '%s\n%s\n' SHA256SUMS.txt "$out.zip" | sort)
            [[ "$asset_names" == "$expected_names" ]] || continue
            gh release verify "$candidate" --format json >/dev/null || continue

            candidate_dir="${RUNNER_TEMP}/candidate-${candidate##*-beta}"
            mkdir -p "$candidate_dir"
            gh release download "$candidate" --dir "$candidate_dir" --pattern "$out.zip" --pattern SHA256SUMS.txt || continue
            ( cd "$candidate_dir" && shasum -a 256 -c SHA256SUMS.txt ) || continue
            attestation_args=(
              --repo "${GITHUB_REPOSITORY}"
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
              --source-digest "${GITHUB_SHA}"
              --source-ref "refs/tags/$candidate"
            )
            gh attestation verify "$candidate_dir/$out.zip" "${attestation_args[@]}" >/dev/null || continue

            beta_tag="$candidate"
            promotion_dir="$candidate_dir"
            break
          done < <(
            gh release list --limit 1000 --json tagName,isDraft,isImmutable,isPrerelease --jq '
                [.[] |
                  select(.isDraft == false and .isImmutable == true and .isPrerelease == true) |
                  select(.tagName | startswith("v'"${base}"'-beta")) |
                  select(.tagName | test("-beta[1-9][0-9]*$")) |
                  . + {beta_number: (.tagName | capture("beta(?<n>[0-9]+)$").n | tonumber)}
                ] |
                sort_by(.beta_number) |
                reverse |
                .[].tagName
              '
          )

          [[ -n "$beta_tag" ]] || {
            echo "ERROR: no immutable attested beta from this commit is promotable"
            exit 1
          }
          {
            echo "beta_tag=$beta_tag"
            echo "promotion_dir=$promotion_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Publish production release
        if: needs.validate.outputs.is_beta == 'false' && steps.state.outputs.release_exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="${{ needs.validate.outputs.out }}"
          promotion_dir="${{ steps.promote.outputs.promotion_dir }}"
          release_args=(
            "${GITHUB_REF_NAME}"
            "$promotion_dir/$out.zip"
            "$promotion_dir/SHA256SUMS.txt"
            --verify-tag
            --latest
            --title "devtrim ${{ needs.validate.outputs.release }}"
            --notes-file handoff/release-notes.md
          )
          gh release create "${release_args[@]}"

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="${{ needs.validate.outputs.out }}"
          published="${RUNNER_TEMP}/published"
          mkdir -p "$published"
          gh release download "${GITHUB_REF_NAME}" --dir "$published" --pattern "$out.zip" --pattern SHA256SUMS.txt
          asset_names=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)
          expected_names=$(printf '%s\n%s\n' SHA256SUMS.txt "$out.zip" | sort)
          [[ "$asset_names" == "$expected_names" ]] || {
            echo "ERROR: published release asset set is not exact"
            exit 1
          }
          ( cd "$published" && shasum -a 256 -c SHA256SUMS.txt )

          release_state=$(gh release view "${GITHUB_REF_NAME}" --json isDraft,isImmutable,isPrerelease,tagName)
          [[ "$(jq -r .isDraft <<<"$release_state")" == "false" ]]
          [[ "$(jq -r .isImmutable <<<"$release_state")" == "true" ]]
          [[ "$(jq -r .isPrerelease <<<"$release_state")" == "${{ needs.validate.outputs.is_beta }}" ]]

          release_verified=false
          for _ in {1..10}; do
            if gh release verify "${GITHUB_REF_NAME}" --format json >/dev/null; then
              release_verified=true
              break
            fi
            sleep 3
          done
          [[ "$release_verified" == "true" ]] || {
            echo "ERROR: immutable release attestation did not verify"
            exit 1
          }

          attestation_args=(
            --repo "${GITHUB_REPOSITORY}"
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            --source-digest "${GITHUB_SHA}"
          )
          if [[ "${{ needs.validate.outputs.is_beta }}" == "true" ]]; then
            attestation_args+=(--source-ref "${GITHUB_REF}")
          fi
          gh attestation verify "$published/$out.zip" "${attestation_args[@]}" >/dev/null
